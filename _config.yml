# EMO 2027 Conference Website
# https://www.emo2027.org

title: EMO 2027
description: "14th International Conference on Evolutionary Multi-Criterion Optimization"
url: "https://www.emo2027.org"
baseurl: ""
logo: /assets/images/logo.webp

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - TODO.md
  - serve.sh
  - vendor/
  - 2025_site/
  - EMO_2027_bid.docx
  - .ruby-version
  - node_modules/
  - .mdlrc
  - .stylelintrc.json
  - assets/images/logo-highres.png
  - assets/images/banner-highres.png

# Include pages directory
include:
  - pages

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      # Link preview image (og:image / twitter:image) for every page.
      # 1200x630, made from banner-highres.png padded with the banner background colour.
      image:
        path: /assets/images/social-card.jpg
        width: 1200
        height: 630
        alt: "Illustration of Exeter Cathedral beside the text: International Conference on Evolutionary Multi-Criterion Optimization, 5-8 April, 2027, Exeter, UK"
  - scope:
      path: "pages"
    values:
      layout: "page"

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections_dir: .

# Search
search:
  enabled: true
